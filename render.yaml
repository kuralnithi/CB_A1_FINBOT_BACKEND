# ─── Render Blueprint ─────────────────────────────────────────────────────────
# https://docs.render.com/infrastructure-as-code
#
# To deploy:
#   1. Push this repo to GitHub
#   2. Go to https://dashboard.render.com → New → Blueprint
#   3. Connect the repo → Render auto-detects this file
#   4. Set env vars in the dashboard (see .env.example)
# ──────────────────────────────────────────────────────────────────────────────

services:
  - type: web
    name: finbot-backend
    runtime: docker
    region: oregon

    # Docker config — build from backend/ subdirectory
    dockerfilePath: ./Dockerfile
    dockerContext: .

    # Health check — Render pings this to determine if the service is alive.
    # startPeriod gives time for model downloads + migrations on first deploy.
    healthCheckPath: /health

    # Scaling
    plan: starter  # Change to 'standard' for production workloads

    # Environment variables — set secret values in Render Dashboard
    envVars:
      # ── LLM ──
      - key: LLM_PROVIDER
        value: groq
      - key: LLM_MODEL_NAME
        value: llama-3.1-8b-instant
      - key: GROQ_API_KEY
        sync: false  # Must be set manually in Dashboard
      - key: GOOGLE_API_KEY
        sync: false  # Only needed if LLM_PROVIDER=gemini

      # ── Embeddings ──
      - key: EMBEDDING_MODEL_NAME
        value: BAAI/bge-small-en-v1.5

      # ── Qdrant ──
      - key: QDRANT_HOST
        sync: false
      - key: QDRANT_PORT
        value: "6333"
      - key: QDRANT_API_KEY
        sync: false

      # ── PostgreSQL ──
      - key: DATABASE_URL
        sync: false  # Set your Neon/Supabase connection string

      # ── Auth ──
      - key: JWT_SECRET_KEY
        generateValue: true  # Render auto-generates a secure random value
      - key: ADMIN_USER
        value: finbot_admin
      - key: ADMIN_PASS
        sync: false  # Set a strong password in Dashboard

      # ── Data ──
      - key: DATA_DIR
        value: /app/data

      # ── HuggingFace cache ──
      - key: HF_HOME
        value: /app/model_cache
      - key: TRANSFORMERS_CACHE
        value: /app/model_cache
